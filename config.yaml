# Load balancer configuration. Env vars override: REDIS_ADDR, RETRIES_ENABLED.

load_balancer:
  port: 8080
  timeout: 5s
  # retries_enabled: false disables retry on idempotent method failures.
  retries_enabled: true

route:
  # Changeable per experiment: round-robin | least-connections | weighted
  policy: "round-robin"
  backends:
    - endpoint: "http://api.internal:8080"
      weight: 100

health_check:
  interval: 10s
  timeout: 5s

redis:
  addr: "redis:6379"
  password: ""
  db: 0